
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGB Color Creator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f2f2f2;
    }

    .app {
      width: min(90vw, 520px);
      padding: 2rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .color-circle {
      width: 220px;
      height: 220px;
      margin: 1.5rem auto 2rem;
      border-radius: 50%;
      background: rgb(128, 128, 128);
      box-shadow:
        inset 0 0 20px rgba(0,0,0,.15),
        0 8px 20px rgba(0,0,0,.15);
    }

    .slider {
      margin: 1.2rem 0;
      text-align: left;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: .4rem;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .value {
      min-width: 3rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .hex {
      margin-top: 1.5rem;
      padding: .8rem;
      border-radius: 10px;
      background: #f0f0f0;
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="app">
    <h1>RGB Color Creator</h1>

    <div class="color-circle" id="colorCircle"></div>

    <div class="slider">
      <div class="slider-header">
        <span>Red</span>
        <span class="value" id="redValue">128</span>
      </div>
      <input id="red" type="range" min="0" max="255" value="128">
    </div>

    <div class="slider">
      <div class="slider-header">
        <span>Green</span>
        <span class="value" id="greenValue">128</span>
      </div>
      <input id="green" type="range" min="0" max="255" value="128">
    </div>

    <div class="slider">
      <div class="slider-header">
        <span>Blue</span>
        <span class="value" id="blueValue">128</span>
      </div>
      <input id="blue" type="range" min="0" max="255" value="128">
    </div>

    <div class="hex" id="hexValue">#808080</div>
  </main>

  <script>
    const red = document.getElementById("red");
    const green = document.getElementById("green");
    const blue = document.getElementById("blue");

    const redValue = document.getElementById("redValue");
    const greenValue = document.getElementById("greenValue");
    const blueValue = document.getElementById("blueValue");

    const circle = document.getElementById("colorCircle");
    const hexValue = document.getElementById("hexValue");

    function updateColor() {
      const r = Number(red.value);
      const g = Number(green.value);
      const b = Number(blue.value);

      const rgb = `rgb(${r}, ${g}, ${b})`;

      circle.style.backgroundColor = rgb;

      redValue.textContent = r;
      greenValue.textContent = g;
      blueValue.textContent = b;

      const hex =
        "#" +
        [r, g, b]
          .map(value => value.toString(16).padStart(2, "0"))
          .join("")
          .toUpperCase();

      hexValue.textContent = hex;
    }

    red.addEventListener("input", updateColor);
    green.addEventListener("input", updateColor);
    blue.addEventListener("input", updateColor);

    updateColor();
  </script>

</body>
</html>
