<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Creator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    color: #eee;
  }

  .card {
    background: #2a2a3d;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 340px;
  }

  h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 1px; }

  /* ---------- the color circle ---------- */
  #swatch {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 4px solid #fff2;
    transition: background-color .15s ease, box-shadow .15s ease;
  }

  /* ---------- sliders ---------- */
  .slider-row {
    width: 100%;
    display: grid;
    grid-template-columns: 24px 1fr 40px;
    align-items: center;
    gap: 12px;
  }

  .slider-row label { font-weight: 700; text-align: center; }
  .slider-row.r label { color: #ff6b6b; }
  .slider-row.g label { color: #69db7c; }
  .slider-row.b label { color: #74a9ff; }

  .slider-row output {
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: #bbb;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"].r { background: linear-gradient(to right, #000, #f00); }
  input[type="range"].g { background: linear-gradient(to right, #000, #0f0); }
  input[type="range"].b { background: linear-gradient(to right, #000, #00f); }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #1e1e2e;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #1e1e2e;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }

  /* ---------- hex readout ---------- */
  #hex {
    font-family: 'Consolas', monospace;
    font-size: 1.1rem;
    background: #1e1e2e;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    user-select: all;
    transition: background .2s;
  }
  #hex:hover { background: #33334a; }
</style>
</head>
<body>

<div class="card">
  <h1>🎨 Color Creator</h1>

  <div id="swatch"></div>

  <div class="slider-row r">
    <label for="r">R</label>
    <input type="range" id="r" class="r" min="0" max="255" value="120">
    <output id="rOut">120</output>
  </div>

  <div class="slider-row g">
    <label for="g">G</label>
    <input type="range" id="g" class="g" min="0" max="255" value="200">
    <output id="gOut">200</output>
  </div>

  <div class="slider-row b">
    <label for="b">B</label>
    <input type="range" id="b" class="b" min="0" max="255" value="90">
    <output id="bOut">90</output>
  </div>

  <div id="hex" title="Click to copy">#78C85A</div>
</div>

<script>
  const sliders = ['r', 'g', 'b'].map(id => document.getElementById(id));
  const swatch  = document.getElementById('swatch');
  const hexEl   = document.getElementById('hex');

  function update() {
    const [r, g, b] = sliders.map(s => Number(s.value));

    // live value labels
    document.getElementById('rOut').textContent = r;
    document.getElementById('gOut').textContent = g;
    document.getElementById('bOut').textContent = b;

    // circle color + soft glow matching it
    swatch.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
    swatch.style.boxShadow = `0 0 40px rgba(${r}, ${g}, ${b}, 0.6)`;

    // hex readout
    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
    hexEl.textContent = hex;
  }

  sliders.forEach(s => s.addEventListener('input', update));

  // click the hex code to copy it
  hexEl.addEventListener('click', () => {
    navigator.clipboard.writeText(hexEl.textContent);
    const old = hexEl.textContent;
    hexEl.textContent = 'copied!';
    setTimeout(() => (hexEl.textContent = old), 700);
  });

  update(); // initial paint
</script>

</body>
</html>
